# ── CyberWatch Docker Compose ──────────────────────────────────────
# Usage:
#   docker-compose up -d              → Start dashboard on port 8080
#   docker-compose run fetcher        → Run one-off intel fetch
#   docker-compose -f docker-compose.yml -f docker-compose.cron.yml up
#                                    → With scheduled fetcher
# ────────────────────────────────────────────────────────────────────

services:
  dashboard:
    build:
      context: .
      target: frontend
    ports:
      - "8080:80"
    volumes:
      # ./data already contains archive/ — mounting it a second time was a
      # no-op that only obscured which path won.
      - ./data:/usr/share/nginx/html/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3

  fetcher:
    build:
      context: .
      target: fetcher
    volumes:
      - ./data:/app/data
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OTX_API_KEY=${OTX_API_KEY:-}
      - NVD_API_KEY=${NVD_API_KEY:-}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - PHISHTANK_API_KEY=${PHISHTANK_API_KEY:-}
      - THREATFOX_API_KEY=${THREATFOX_API_KEY:-}
      - MB_API_KEY=${MB_API_KEY:-}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - WEBHOOK_TYPE=${WEBHOOK_TYPE:-slack}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_TO=${SMTP_TO:-}
    profiles:
      - manual
