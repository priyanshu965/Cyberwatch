# ═══════════════════════════════════════════════════════════════════════════════
# CYBERWATCH — .github/workflows/ci.yml
#
# Runs the unit suite on every push and pull request. Previously NO workflow
# executed tests/test_pipeline.py at all, and the tests themselves re-implemented
# the functions they claimed to cover — so 30 green tests exercised zero lines of
# production code.
# ═══════════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Byte-compile all sources
        run: python -m compileall -q scripts tests

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install linters
        run: pip install ruff

      - name: Ruff
        run: ruff check scripts tests --output-format=github

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Reject committed API keys
        run: |
          # Cheap, targeted guard for the key shapes this project actually uses.
          # A leaked key in a public repo is scraped within minutes.
          PATTERNS='vulncheck_[a-f0-9]{40,}|AIza[0-9A-Za-z_-]{30,}|gsk_[A-Za-z0-9]{40,}|xoxb-[0-9A-Za-z-]{20,}'
          if grep -rInE "$PATTERNS" --include='*.py' --include='*.js' --include='*.yml' \
               --include='*.yaml' --include='*.json' --include='*.md' . ; then
            echo "::error::A credential appears to be committed. Rotate it, then remove it from the tree."
            exit 1
          fi
          echo "No committed credentials found."

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check JavaScript
        run: |
          node --check app.js
          node --check service-worker.js
          for f in js/*.js; do node --check "$f"; done

      # The query language is the most bug-prone thing in the frontend: it is a
      # pile of ordered rewrite rules, and the failure mode of ordered rewrite
      # rules is that a later rule eats a token an earlier one produced —
      # silently, with no error, returning a plausible wrong answer. Five such
      # bugs were found by hand before this suite existed, including one that
      # inverted a clause.
      - name: Query-language tests
        run: node --test tests/query.test.js

      # The v4 frontend is app.js plus three sibling modules loaded as classic
      # scripts. app.js calls into them by name (showGraphView, parseQuery,
      # renderTimeMachine, ...), so a renamed or deleted function is a runtime
      # ReferenceError that no syntax check catches. This is that check — a
      # module has silently failed to land in this project before.
      - name: Verify cross-module entry points exist
        run: |
          set -e
          missing=0
          for fn in showGraphView showCampaignsView showDetectionsView \
                    showMalwareView showResearchView showDiffView \
                    renderTimeMachine enterDay parseQuery queryMatches \
                    queryExplain queryExamples queryFields; do
            if ! grep -qE "function ${fn}\b" js/*.js; then
              echo "::error::app.js calls ${fn}() but no js/ module defines it"
              missing=1
            fi
          done
          for fn in showLazyView emptyState openEntityModal closePanel setView; do
            if ! grep -qE "function ${fn}\b" app.js; then
              echo "::error::js/ modules call ${fn}() but app.js does not define it"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "All cross-module entry points resolve."

      - name: Verify every view has a container and a route
        run: |
          set -e
          fail=0
          for view in $(grep -oE 'data-view="[a-z]+"' index.html | cut -d'"' -f2); do
            [ "$view" = "feed" ] && continue
            if ! grep -q "id=\"${view}-view\"" index.html; then
              echo "::error::view '${view}' has a nav button but no #${view}-view container"
              fail=1
            fi
            if ! grep -q "case '${view}':" app.js; then
              echo "::error::view '${view}' has a nav button but no route in renderAll()"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "Every view button has a container and a route."

      - name: Reject render-blocking CDN scripts
        run: |
          # Mermaid is 3.3 MB and is loaded on demand by app.js (with an SRI
          # hash). A plain <script src="https://..."> in the head puts that
          # back on the critical path for every visitor.
          if grep -nE '<script[^>]+src="https?://' index.html; then
            echo "::error::External <script> in index.html — load it on demand from app.js instead."
            exit 1
          fi
          echo "No blocking CDN scripts."

      - name: Reject inline event handlers
        run: |
          # The CSP sets script-src without 'unsafe-inline', so any onclick=
          # attribute is silently dead code in the browser.
          if grep -nE '\son[a-z]+="' index.html app.js js/*.js; then
            echo "::error::Inline event handler found — blocked by the page CSP. Use delegated listeners."
            exit 1
          fi
          echo "No inline handlers."

      - name: Reject innerHTML on feed-derived content
        run: |
          # Every string on screen originates in one of 43 third-party feeds.
          # escapeHTML() exists, but the only way to be certain it was reached
          # is for the unsafe sink not to be present at all.
          if grep -nE '\.(innerHTML|outerHTML)[[:space:]]*=|insertAdjacentHTML' app.js js/*.js; then
            echo "::error::innerHTML assignment found. Build nodes with el()/textContent."
            exit 1
          fi
          echo "No innerHTML sinks."

      - name: Verify the CSP has not been widened
        run: |
          # Natural-language search runs locally precisely so connect-src does
          # not have to grow. Reaching a model API from a static page means
          # shipping the API key to every visitor.
          CSP=$(grep -o 'content="default-src[^"]*"' index.html || true)
          if [ -z "$CSP" ]; then echo "::error::No CSP meta tag found."; exit 1; fi
          if echo "$CSP" | grep -q "script-src [^;]*unsafe-inline"; then
            echo "::error::script-src gained 'unsafe-inline'."
            exit 1
          fi
          if echo "$CSP" | grep -qE "connect-src[^;]*(generativelanguage|api\.openai|api\.groq)"; then
            echo "::error::connect-src reaches a model API. A static page cannot hold an API key."
            exit 1
          fi
          echo "CSP intact."
