# ═══════════════════════════════════════════════════════════════════════════════
# OPENTHREAT DASHBOARD — .github/workflows/update.yml
#
# Runs every hour. Fetches fresh threat intel, enriches the top AI_ENRICH_LIMIT
# items in batches via Gemini (primary) with Groq as failover, then:
#   - PUBLISHES intel.json + exports + the static API as a Pages deployment
#   - COMMITS only durable state (daily archive, health summary, dedup memory)
#
# The derived data is deliberately not committed. It changes every hour and
# nothing reads the history back, so committing it added ~106 MB/year.
# Pages must be set to build_type=workflow for the deploy step to publish.
#
# Required Secrets (Settings → Secrets and variables → Actions):
#   GEMINI_API_KEY    ← Gemini (primary AI)  https://aistudio.google.com
#   GROQ_API_KEY      ← Groq (failover AI)    https://console.groq.com
#   VULNCHECK_API_KEY ← VulnCheck KEV superset (optional, free)
#   OTX_API_KEY       ← AlienVault OTX (optional)
#
# NOTE: CISA Vulnrichment (SSVC) and the EPSS bulk corpus need no key at all.
# ═══════════════════════════════════════════════════════════════════════════════

name: Hourly Intel Update

on:
  schedule:
    - cron: '0 */1 * * *'   # Every hour
  workflow_dispatch:          # Manual trigger from Actions tab

jobs:
  fetch-and-update:
    name: Fetch Threat Intelligence
    runs-on: ubuntu-latest

    permissions:
      contents: read      # nothing is committed back - see "Persist state" below
      issues:   write     # file a pipeline-failure issue (uses GITHUB_TOKEN)
      pages: write        # publish the dashboard + data as a Pages deployment
      id-token: write     # OIDC token actions/deploy-pages exchanges

    # Never let two deployments race. A manual dispatch overlapping the cron
    # used to be a push conflict; with Pages it would be a deployment conflict.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1          # history is never read here; a full clone grew ~20 MB/day

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-openthreat-v2
          restore-keys: |
            ${{ runner.os }}-pip-

      # Without this the runner starts every hour with an empty data/.cache,
      # so every TTL in fetch_intel.py (EPSS bulk 24h, CISA KEV 24h, VulnCheck
      # 12h, PoC-in-GitHub 6h, Vulnrichment 14d) missed on all 24 daily runs.
      # Vulnrichment alone is one raw.githubusercontent request PER CVE — ~70 a
      # run, ~1,700 a day against a rate-limited host. .feed_meta.json is the
      # ETag/Last-Modified store, so restoring it is what makes the conditional
      # GETs in fetch_rss() actually conditional. ai_enrich.json inside
      # data/.cache is what stops the same items being re-sent to Gemini 24x.
      #
      # The key rotates per run so the cache is always re-saved with whatever
      # this run refreshed; restore-keys fall back to the newest earlier copy.
      # Entries past their TTL are simply re-fetched.
      - name: Restore intel fetch cache
        uses: actions/cache@v6
        with:
          path: |
            data/.cache
            data/.feed_meta.json
            data/archive
            data/source_health_summary.json
            data/.alert_state.json
            data/.digest_state.json
          key: openthreat-state-${{ github.run_id }}
          restore-keys: |
            openthreat-state-

      # The cache is the fast path and, being read every hour, is never evicted
      # in practice. This is the fallback for when it is: the previous run
      # published the same state as a tarball next to the dashboard. Failing
      # both, the copy committed in the repo acts as a seed - stale, but enough
      # for trends and the "new since last run" diff to rebuild themselves.
      - name: Restore state from the last deployment (cache miss only)
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ -d data/archive ] && [ -n "$(ls -A data/archive 2>/dev/null)" ] \
             && [ -f data/source_health_summary.json ]; then
            echo "State present from cache or repo seed - nothing to restore."
            exit 0
          fi
          URL="${DASHBOARD_URL:-https://priyanshu965.github.io/OpenThreat/}"
          echo "Cache missed; pulling state from ${URL}data/state.tar.gz"
          if curl -fsSL --max-time 120 -o /tmp/state.tar.gz "${URL}data/state.tar.gz"; then
            mkdir -p data && tar -xzf /tmp/state.tar.gz -C data
            echo "Restored $(ls data/archive 2>/dev/null | wc -l) archive snapshot(s)."
          else
            echo "No published state to restore; continuing with whatever the repo carries."
          fi
        env:
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Sigma -> SIEM query compilation. BEST EFFORT, and the `|| true` is the
      # whole design: pySigma and its backends are a fast-moving family with
      # tight inter-version constraints, and this job runs unattended 24 times
      # a day. A resolver conflict here must cost the hunt packs their compiled
      # queries, never the feed. hunt_packs probes each backend independently
      # at import and publishes the packs regardless.
      - name: Install optional Sigma query backends
        continue-on-error: true
        run: |
          pip install -r requirements-hunt.txt || \
            echo "::warning::Sigma query backends unavailable - hunt packs will carry raw rules only"

      - name: Fetch threat intelligence
        env:
          GROQ_API_KEY:   ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OTX_API_KEY:    ${{ secrets.OTX_API_KEY }}
          ABUSEIPDB_API_KEY: ${{ secrets.ABUSEIPDB_API_KEY }}
          PHISHTANK_API_KEY: ${{ secrets.PHISHTANK_API_KEY }}
          NVD_API_KEY:       ${{ secrets.NVD_API_KEY }}
          THREATFOX_API_KEY: ${{ secrets.THREATFOX_API_KEY }}
          VULNCHECK_API_KEY: ${{ secrets.VULNCHECK_API_KEY }}
          MB_API_KEY:        ${{ secrets.MB_API_KEY }}
          # Alerting (optional — leave WEBHOOK_URL unset to disable):
          WEBHOOK_URL:  ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_TYPE: ${{ vars.WEBHOOK_TYPE }}
          ALERT_SEVERITIES: ${{ vars.ALERT_SEVERITIES }}
          ALERT_MIN_PRIORITY: ${{ vars.ALERT_MIN_PRIORITY }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          # CASM: your own estate. Without these the exposure and attack-surface
          # checks have nothing to look at and silently do nothing.
          MY_DOMAINS:    ${{ vars.MY_DOMAINS }}
          DARKWEB_WATCH: ${{ vars.DARKWEB_WATCH }}
          # Own-estate findings stay off the public site unless this is set.
          PUBLISH_OWN_ESTATE: ${{ vars.PUBLISH_OWN_ESTATE }}
        run: |
          python scripts/fetch_intel.py

      # ── Persist state WITHOUT committing ─────────────────────────────
      # This job used to commit on every run, which added ~24 commits a day to
      # main forever. Nothing read that history back: the next run only needs
      # the newest state, which the cache above already carries between runs.
      # The tarball published below is the durable copy, so the commit was pure
      # cost. main now only moves when a person changes something.
      - name: Summarise state (not committed)
        run: |
          echo "Archive snapshots : $(ls data/archive 2>/dev/null | wc -l)"
          echo "Health summary    : $(du -h data/source_health_summary.json 2>/dev/null | cut -f1)"
          echo "State is carried by the actions cache and republished below;"
          echo "no commit is made to ${GITHUB_REF_NAME}."

      # ── Publish the dashboard + fresh data as a Pages deployment ──────
      # The site is assembled here rather than served from the branch, so the
      # data never enters git history. Paths are unchanged: index.html still
      # sits at the root and still fetches ./data/intel.json, so nothing in the
      # frontend or the documented static API URLs moves.
      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html app.js style.css service-worker.js manifest.json robots.txt _site/
          # The v4 frontend is app.js PLUS three sibling modules. Forgetting
          # this line ships a page whose every view button throws a
          # ReferenceError, and nothing in the pipeline would notice.
          mkdir -p _site/js
          cp js/*.js _site/js/
          mkdir -p _site/data
          # Everything the browser and the documented API actually fetch.
          cp data/intel.json                _site/data/
          cp data/trends.json               _site/data/ 2>/dev/null || true
          cp data/source_health_summary.json _site/data/ 2>/dev/null || true
          cp -r data/exports                _site/data/ 2>/dev/null || true
          # data/api includes api/day/*.json — the reduced per-day snapshots the
          # time machine and the diff view read. ~90 files, ~7 MB total, each
          # fetched only when someone actually opens that day.
          cp -r data/api                    _site/data/ 2>/dev/null || true
          # data/archive/ is not published as loose files - no page requests
          # them - but it IS published as one tarball, which is what lets a run
          # rebuild its own state after a cache miss without any git history.
          #
          # Named files only, never `data/.cache` wholesale. That directory also
          # holds exposure_*.json and ct_*.json — YOUR estate's credential
          # exposure and subdomain inventory — and this tarball is published at
          # a public URL. Adding the cache directory here would undo
          # CONFIG.publish_own_estate in a single line.
          #
          # The derived corpora below are public reference data and are
          # expensive to rebuild — ATT&CK is a 48 MB download, ORKL is ~35 MB
          # of report text reduced to citations, and sigma_queries.json is
          # several thousand rule compilations — so carrying them makes a
          # cache miss cheap instead of punishing. All are DERIVED and small;
          # none of them is own-estate data.
          #
          # sigma_seen_rules.json is the detection-diff baseline. Losing it
          # is not fatal but it costs one cycle: the next run re-baselines
          # and reports no changes rather than inventing 3,000 of them.
          STATE_PATHS=""
          for candidate in \
              archive \
              source_health_summary.json \
              .alert_state.json \
              .digest_state.json \
              .cache/attack_kb_v2.json \
              .cache/malpedia_families.json \
              .cache/sigma_index.json \
              .cache/sigma_queries.json \
              .cache/sigma_seen_rules.json \
              .cache/cve_published.json \
              .cache/misp_galaxy.json \
              .cache/orkl_reports.json \
              .cache/d3fend_map.json \
              .cache/control_mappings.json \
              .cache/atomic_red_team.json \
              .cache/leak_sites.json; do
            [ -e "data/${candidate}" ] && STATE_PATHS="${STATE_PATHS} ${candidate}"
          done
          # shellcheck disable=SC2086
          tar -czf _site/data/state.tar.gz -C data ${STATE_PATHS}
          echo "state.tar.gz: $(du -h _site/data/state.tar.gz | cut -f1)"
          # An own-estate file reaching the public tarball is a leak, not
          # something to notice later. Check the artifact itself rather than
          # trusting the list above to stay correct.
          if tar -tzf _site/data/state.tar.gz | grep -qE 'exposure_|ct_|attack_surface'; then
            echo "::error::own-estate data found in the public state tarball"
            exit 1
          fi
          # Fail loudly rather than deploying a broken page. A missing js/
          # module is invisible until a visitor clicks a view; a missing
          # intel.json is invisible until the feed fails to load.
          for required in \
              index.html app.js style.css \
              js/query.js js/research.js js/timetravel.js \
              js/library.js js/hunt.js js/leaks.js \
              data/intel.json; do
            if [ ! -s "_site/${required}" ]; then
              echo "::error::_site/${required} is missing or empty — refusing to deploy"
              exit 1
            fi
          done
          # Every ?v= reference in index.html must resolve to a file we shipped.
          for asset in $(grep -oE '(app\.js|style\.css|js/[a-z]+\.js)\?v=' index.html | sed 's/?v=//' | sort -u); do
            [ -s "_site/${asset}" ] || { echo "::error::index.html references ${asset}, not deployed"; exit 1; }
          done
          # The Library is an index PLUS thousands of shards. An index without
          # shards is a search box where every result 404s -- worse than no
          # Library at all, and invisible until somebody clicks a result.
          if [ -s "_site/data/api/entity_index.json" ]; then
            SHARDS=$(ls _site/data/api/entity 2>/dev/null | wc -l)
            if [ "${SHARDS}" -lt 100 ]; then
              echo "::error::entity_index.json shipped with only ${SHARDS} shards"
              exit 1
            fi
            echo "  library: ${SHARDS} entity shards"
          else
            echo "::warning::no entity_index.json - the Library will be empty"
          fi
          # Same shape, same failure mode: an index of packs whose shards are
          # missing is a list where every row 404s on click.
          if [ -s "_site/data/api/hunt_packs.json" ]; then
            PACKS=$(ls _site/data/api/hunt 2>/dev/null | wc -l)
            if [ "${PACKS}" -lt 10 ]; then
              echo "::error::hunt_packs.json shipped with only ${PACKS} pack shards"
              exit 1
            fi
            echo "  hunt: ${PACKS} pack shards"
          fi
          echo "Deploying $(du -sh _site | cut -f1):"
          echo "  day snapshots: $(ls _site/data/api/day 2>/dev/null | wc -l)"
          # The entity shards are thousands of files; listing them all buries
          # every other line of the log.
          find _site -type f -not -path '*/api/entity/*' -not -path '*/api/hunt/*' | sort | sed 's/^/  /'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # A sustained outage used to open 24 identical issues a day. Only file one
      # if there isn't already an open pipeline-failure issue.
      - name: Check for an existing failure issue
        if: failure()
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(gh issue list --repo "${{ github.repository }}" \
                    --label pipeline-failure --state open --limit 1 --json number \
                    --jq 'length' 2>/dev/null || echo 0)
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"

      - name: Notify on failure
        if: failure() && steps.existing.outputs.count == '0'
        uses: dacbd/create-issue-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          labels: pipeline-failure
          title: "🚨 Pipeline failure — ${{ github.run_id }}"
          body: |
            The hourly intel pipeline **failed** on ${{ github.repository }}.

            - **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - **Branch:** ${{ github.ref_name }}
            - **Commit:** ${{ github.sha }}

            Check the logs above for details.

      - name: Print summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("data/intel.json")
          if not p.exists():
              print("## OpenThreat — no output produced"); raise SystemExit
          d = json.loads(p.read_text(encoding="utf-8"))
          items = d.get("items", [])
          print("## OpenThreat Update Complete\n")
          print(f"- **Items:** {len(items)}")
          print(f"- **Last updated:** {d.get('last_updated','?')}")
          print(f"- **Sources:** {d.get('sources_ok',0)} ok · "
                f"{d.get('sources_stale',0)} stale · {d.get('sources_empty',0)} empty · "
                f"{d.get('sources_error',0)} error (of {d.get('sources_configured','?')})")
          print(f"- **AI enriched:** {d.get('ai_enriched_count',0)}")
          print(f"- **New since last run:** {d.get('new_since_last',0)}")
          print(f"- **Urgent / elevated:** "
                f"{sum(1 for i in items if i.get('priority_label')=='urgent')} / "
                f"{sum(1 for i in items if i.get('priority_label')=='elevated')}")
          print(f"- **Actively exploited (KEV or SSVC):** "
                f"{sum(1 for i in items if i.get('cisa_kev') or i.get('ssvc_exploitation')=='active')}")
          print(f"- **Payload size:** {p.stat().st_size // 1024} KB")
          # Own-estate findings are deliberately NOT published to the public
          # site, so this summary (visible only to repo collaborators) is where
          # they surface. See CONFIG.publish_own_estate.
          expo = d.get("exposure") or {}
          if expo.get("domains"):
              t = expo.get("totals", {})
              print("\n### Your exposure (not published publicly)\n")
              print(f"- **Employee machines in infostealer logs:** {t.get('employees', 0):,}")
              print(f"- **User machines:** {t.get('users', 0):,}")
              print(f"- **Third-party machines:** {t.get('third_parties', 0):,}\n")
              print("| Domain | Employees | Users | Third parties | Last employee compromise |")
              print("|---|---:|---:|---:|---|")
              for row in expo["domains"]:
                  print(f"| `{row['domain']}` | {row['employees']:,} | {row['users']:,} "
                        f"| {row['third_parties']:,} | {row.get('last_employee_compromised') or '-'} |")

          surf = d.get("attack_surface") or {}
          if surf.get("domains"):
              print(f"\n### External attack surface — {surf.get('total_hostnames', 0)} hostnames\n")
              for row in surf["domains"]:
                  print(f"**`{row['domain']}`** — {row['hostnames']} hostname(s)")
                  if row.get("noteworthy"):
                      print("\nNoteworthy (dev/staging/vpn/admin style):\n")
                      for h in row["noteworthy"][:25]:
                          print(f"- `{h}`")
                  print("")

          watch = d.get("darkweb_watch") or []
          if watch:
              print("\n### Dark-web watchlist hits\n")
              for hit in watch:
                  print(f"- **{hit['term']}** — {hit['count']} leak-site listing(s)")
                  for m in (hit.get("matches") or [])[:5]:
                      print(f"    - {m.get('v')} — claimed by {m.get('g')} on {m.get('d')}")

          if d.get("brief"):
              print(f"\n> {d['brief'].get('headline','')}")
          stale = [n for n, h in d.get("source_health", {}).items() if h.get("status") != "ok"]
          if stale:
              print(f"\n<details><summary>Degraded sources ({len(stale)})</summary>\n")
              for n in stale:
                  h = d["source_health"][n]
                  print(f"- `{n}` — {h.get('status')} ({h.get('error') or h.get('count')} items)")
              print("\n</details>")
          PY
