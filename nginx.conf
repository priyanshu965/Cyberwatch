server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # frame-ancestors is the modern equivalent of X-Frame-Options and, unlike a
    # <meta http-equiv> tag, actually takes effect.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Cache static assets
    location ~* \.(css|js|svg)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Allow intel.json caching (re-fetched by JS with ?v=)
    location /data/ {
        expires 5m;
        add_header Cache-Control "public";
    }

    # Never serve dotfiles. Belt-and-braces alongside .dockerignore: if a
    # .git directory ever reaches the image, this still blocks /.git/config.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Never serve source or test code.
    location ~ ^/(scripts|tests)/ {
        deny all;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
